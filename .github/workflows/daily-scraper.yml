name: Daily Scraper

on:
  schedule:
    # 05:00 KST = 20:00 UTC
    - cron: '0 20 * * *'
  workflow_dispatch: # Manual trigger from GitHub UI → Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scraper.py

      - name: Commit and push updated timetable.db
        run: |
          git config --global user.name  'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add timetable.db
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-update movie timetable $(date -u +'%Y-%m-%d')"
            git push
          else
            echo "timetable.db unchanged — skipping commit"
          fi

      - name: Trigger Vercel redeploy via deploy hook
        # Add your Vercel Deploy Hook URL as a repository secret named VERCEL_DEPLOY_HOOK
        # Settings → Secrets → Actions → New secret
        if: env.VERCEL_DEPLOY_HOOK != ''
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: curl -s -X POST "$VERCEL_DEPLOY_HOOK"
